<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181F">
<title>My Reset</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="app">

  <header class="topbar">
    <div>
      <p class="eyebrow" id="dateLabel">Today</p>
      <h1 class="greeting" id="greeting">Good morning</h1>
    </div>
    <button class="icon-btn" id="editNameBtn" aria-label="Edit name">✎</button>
  </header>

  <p class="message" id="message">One thing. Finish it.</p>

  <section class="score-card">
    <div class="score-top">
      <span class="score-number" id="scoreNumber">0%</span>
      <span class="score-label">Finisher Score</span>
    </div>
    <div class="gauge">
      <div class="gauge-fill" id="gaugeFill"></div>
    </div>
    <div class="score-stats">
      <div class="stat">
        <span class="stat-value" id="doneCount">0</span>
        <span class="stat-key">done</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="remainingCount">3</span>
        <span class="stat-key">left</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="streakCount">0</span>
        <span class="stat-key">streak</span>
      </div>
    </div>
  </section>

  <section class="tasks-section">
    <div class="section-head">
      <h2>Today's top 3</h2>
    </div>
    <ul class="task-list" id="taskList"></ul>
  </section>

  <p class="rule">Never miss twice.</p>

</main>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="editSheet">
  <div class="sheet-handle"></div>
  <h3 id="sheetTitle">Edit task</h3>
  <input type="text" id="taskTitleInput" placeholder="What are you finishing?" maxlength="60">
  <div class="priority-row">
    <button class="chip" data-priority="Low">Low</button>
    <button class="chip" data-priority="Medium">Medium</button>
    <button class="chip" data-priority="High">High</button>
  </div>
  <input type="text" id="taskTimeInput" placeholder="Estimated time (e.g. 30m)" maxlength="20">
  <button class="save-btn" id="saveTaskBtn">Save</button>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
